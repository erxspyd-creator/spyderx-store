<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spidbrick | WEAR THE DARKNESS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header -->
    <header>
        <div style="display:flex; gap:10px; align-items:center;">
            <button class="icon-btn" style="background:none; border:none; color:white; font-size:1.1rem;">🇫🇷</button>
        </div>
        <a href="#" class="brand-logo">Spidbrick 🕷️</a>
    </header>

    <!-- Hero Section -->
    <section class="hero">
        <div class="hero-brand-title">Spidbrick</div>
        <div class="hero-subtitle">WEAR THE DARKNESS</div>
        <div class="search-box-wrap">
            <input type="text" id="searchInput" class="search-input" placeholder="ابحث عن منتج..." oninput="applyFilters()">
        </div>
    </section>

    <!-- Featured Banner -->
    <div class="featured-banner">
        <h3>المجموعة المميزة</h3>
        <p>هوديات ثقيلة وجينز واسع وجاكيتات قوطية</p>
    </div>

    <!-- Categories -->
    <div style="max-width:1200px; margin:0 auto; padding: 0 15px;">
        <h4 style="margin-bottom:10px; font-size:1rem;">الفئات</h4>
        <div class="categories-bar" id="categoriesBar">
            <button class="cat-pill active" onclick="selectCategory('all', this)">الكل</button>
            <button class="cat-pill" onclick="selectCategory('Hoodies', this)">هوديات</button>
            <button class="cat-pill" onclick="selectCategory('Jeans', this)">جينز</button>
            <button class="cat-pill" onclick="selectCategory('Cargo', this)">كارغو</button>
            <button class="cat-pill" onclick="selectCategory('Jackets', this)">جاكيتات</button>
        </div>
    </div>

    <!-- Products Section -->
    <main class="container">
        <h2 class="section-heading">وصل حديثاً</h2>
        <div class="products-grid" id="productsGrid"></div>
    </main>

    <!-- Product Details Modal -->
    <div class="overlay" id="productModal">
        <div class="modal-box">
            <div class="modal-top">
                <h3 id="pmTitle">اسم المنتج</h3>
                <button class="close-modal" onclick="closeModal('productModal')">&times;</button>
            </div>
            <img id="pmImage" src="" alt="" style="width:100%; height:250px; object-fit:cover; border-radius:8px; margin-bottom:10px;">
            <div id="pmStockStatus" style="font-size:0.85rem; margin-bottom:5px; color:var(--success);"></div>
            <div class="price-row" style="margin-bottom:10px;">
                <span class="current-price" id="pmPrice">0 دج</span>
                <span class="old-price" id="pmOldPrice"></span>
            </div>

            <span class="option-label">المقاس</span>
            <div class="options-list" id="pmSizes"></div>

            <span class="option-label">اللون</span>
            <div class="options-list" id="pmColors"></div>

            <button class="cta-btn" style="width:100%; margin-top:20px; background:var(--accent);" onclick="addToCartFromModal()">
                أضف للسلة
            </button>
        </div>
    </div>

    <!-- Cart & Checkout Modal -->
    <div class="overlay" id="cartModal">
        <div class="modal-box" style="max-width:500px;">
            <div class="modal-top">
                <h3>سلة المشتريات 🛒</h3>
                <button class="close-modal" onclick="closeModal('cartModal')">&times;</button>
            </div>

            <div id="cartItemsList"></div>

            <div id="checkoutSection" style="display:none; margin-top:15px; border-top:1px solid var(--border-color); padding-top:10px;">
                <h4 style="color:var(--accent); margin-bottom:10px;">معلومات التوصيل</h4>
                
                <div class="form-field">
                    <label>الاسم واللقب *</label>
                    <input type="text" id="orderName" placeholder="الاسم الكامل">
                </div>
                <div class="form-field">
                    <label>رقم الهاتف *</label>
                    <input type="tel" id="orderPhone" placeholder="رقم الهاتف">
                </div>
                <div class="form-field">
                    <label>الولاية (58 ولاية) *</label>
                    <select id="orderWilaya" onchange="updateShippingPrices()"></select>
                </div>
                <div class="form-field">
                    <label>البلدية *</label>
                    <input type="text" id="orderCommune" placeholder="البلدية">
                </div>
                <div class="form-field">
                    <label>طريقة التوصيل *</label>
                    <select id="orderDeliveryType" onchange="updateCartTotals()"></select>
                </div>

                <div style="background:var(--bg-main); padding:10px; border-radius:8px; margin:10px 0; font-size:0.9rem;">
                    <div style="display:flex; justify-content:space-between; margin-bottom:3px;">
                        <span>مجموع المنتجات:</span>
                        <span id="cartSubtotal">0 دج</span>
                    </div>
                    <div style="display:flex; justify-content:space-between; margin-bottom:3px;">
                        <span>رسوم التوصيل:</span>
                        <span id="cartShipping">0 دج</span>
                    </div>
                    <div style="display:flex; justify-content:space-between; font-weight:bold; color:var(--success); border-top:1px solid var(--border-color); padding-top:5px;">
                        <span>المجموع الكلي:</span>
                        <span id="cartGrandTotal">0 دج</span>
                    </div>
                </div>

                <button class="cta-btn" style="width:100%; background:#25D366; color:black;" onclick="submitOrder()">
                    تأكيد الطلب عبر الواتساب 📲
                </button>
            </div>
        </div>
    </div>

    <!-- Bottom Navigation Bar -->
    <nav class="bottom-nav">
        <a href="#" class="nav-item active">
            <span>🏠</span>
            <span>الرئيسية</span>
        </a>
        <a href="#shopSection" class="nav-item">
            <span>🗂️</span>
            <span>الفئات</span>
        </a>
        <a href="#" onclick="openCartModal()" class="nav-item">
            <span>🛒</span>
            <span>المنتجات</span>
            <span class="badge" id="cartCount" style="position:absolute; top:2px; right:25%;">0</span>
        </a>
        <a href="#" onclick="openCartModal()" class="nav-item">
            <span>💬</span>
            <span>السلة</span>
        </a>
    </nav>

    <script src="app.js"></script>
</body>
</html>
